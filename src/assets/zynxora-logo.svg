<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0d1a2e"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <radialGradient id="glowRing" cx="50%" cy="50%" r="50%">
      <stop offset="70%" stop-color="transparent"/>
      <stop offset="85%" stop-color="#1a5aff" stop-opacity="0.5"/>
      <stop offset="92%" stop-color="#4d9fff" stop-opacity="0.9"/>
      <stop offset="96%" stop-color="#7ec8ff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8ab4d4"/>
      <stop offset="30%" stop-color="#c8dff0"/>
      <stop offset="55%" stop-color="#ffffff"/>
      <stop offset="75%" stop-color="#a0bdd4"/>
      <stop offset="100%" stop-color="#6090b8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="circle"><circle cx="100" cy="100" r="96"/></clipPath>
  </defs>

  <!-- Background circle -->
  <circle cx="100" cy="100" r="99" fill="url(#bgGrad)"/>

  <!-- Glow ring -->
  <circle cx="100" cy="100" r="95" fill="none" stroke="#1a5aff" stroke-width="1" opacity="0.3"/>
  <circle cx="100" cy="100" r="93" fill="none" stroke="#4d9fff" stroke-width="0.5" opacity="0.5"/>

  <!-- Electric arc top-left -->
  <path d="M 28 52 Q 35 35 52 28" stroke="#4d9fff" stroke-width="1.5" fill="none" opacity="0.9" filter="url(#softGlow)"/>
  <path d="M 22 60 Q 30 30 60 22" stroke="#1a5aff" stroke-width="0.8" fill="none" opacity="0.6"/>

  <!-- ZX monogram — Z shape -->
  <!-- Top horizontal bar of Z -->
  <path d="M 56 62 L 102 62" stroke="url(#metalGrad)" stroke-width="8" stroke-linecap="square" fill="none" filter="url(#glow)"/>
  <!-- Diagonal of Z -->
  <path d="M 100 64 L 66 96" stroke="url(#metalGrad)" stroke-width="7" stroke-linecap="butt" fill="none" filter="url(#glow)"/>
  <!-- Bottom horizontal bar of Z -->
  <path d="M 58 98 L 104 98" stroke="url(#metalGrad)" stroke-width="8" stroke-linecap="square" fill="none" filter="url(#glow)"/>

  <!-- X shape (right half, overlapping) -->
  <!-- X left-down stroke -->
  <path d="M 90 62 L 144 116" stroke="url(#metalGrad)" stroke-width="8" stroke-linecap="square" fill="none" filter="url(#glow)"/>
  <!-- X right-down stroke -->
  <path d="M 144 62 L 90 116" stroke="url(#metalGrad)" stroke-width="8" stroke-linecap="square" fill="none" filter="url(#glow)"/>

  <!-- White shine highlights -->
  <path d="M 58 63 L 90 63" stroke="white" stroke-width="1.5" opacity="0.7" stroke-linecap="round"/>
  <path d="M 92 63 L 108 63" stroke="white" stroke-width="1.5" opacity="0.5" stroke-linecap="round"/>
  <path d="M 59 99 L 80 99" stroke="white" stroke-width="1.5" opacity="0.5" stroke-linecap="round"/>

  <!-- Text: ZynxOra -->
  <text x="100" y="144" font-family="'Inter Tight', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="600" fill="white" text-anchor="middle" letter-spacing="1">ZynxOra</text>
  <!-- Text: RESEARCH -->
  <text x="100" y="160" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="9" font-weight="400" fill="#7ec8ff" text-anchor="middle" letter-spacing="3.5">RESEARCH</text>
</svg>
